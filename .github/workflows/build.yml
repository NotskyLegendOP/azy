name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# The "attach the installer to the branch" step below pushes a commit; the rest of
# the pipeline only reads. Release-style write access is required just for that.
permissions:
  contents: write

jobs:
  # Fast gate: the portable core (version/compat/settings/theme logic) is unit
  # tested on Linux in a few seconds.
  core-tests:
    name: core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Include hygiene (MSVC safety)
        # clang resolves far more through transitive includes than MSVC does, so a
        # file that omits <string>/<utility>/<cstddef> can build here and fail on
        # Windows. This check has no dependencies and takes microseconds.
        run: python3 tools/check-includes.py
      - name: Configure
        run: cmake -S . -B build -DAZY_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Cross-compile the whole Windows application (Win32 layer + resources) so a
  # Windows-only compile error cannot slip through review.
  windows-cross-compile:
    name: windows cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install ziglang cmake
      - name: Build (x64)
        run: |
          set -o pipefail
          if ! ./scripts/build-windows.sh build-zig 2>&1 | tee /tmp/build.log; then
            # Report the compiler errors as check annotations, so a failure is
            # readable without downloading the raw job log.
            grep -E "error:|fatal error|undefined reference|No such file|FAILED" /tmp/build.log \
              | head -10 | while IFS= read -r line; do echo "::error title=cross build::$line"; done
            exit 1
          fi
          tail -n 6 /tmp/build.log
      - name: Verify the artifact is a Windows GUI executable
        run: |
          python - <<'PY'
          import struct, pathlib, sys
          exe = pathlib.Path('build-zig/AzySkin.exe')
          data = exe.read_bytes()
          pe = struct.unpack_from('<I', data, 0x3c)[0]
          assert data[pe:pe+4] == b'PE\0\0', 'not a PE file'
          machine = struct.unpack_from('<H', data, pe + 4)[0]
          subsystem = struct.unpack_from('<H', data, pe + 24 + 68)[0]
          assert machine == 0x8664, f'expected x64, got {machine:#x}'
          assert subsystem == 2, f'expected GUI subsystem, got {subsystem}'
          print(f'ok: PE32+ x64, GUI subsystem, {len(data)//1024} KB')
          PY
      - name: Inspect the executable's resources
        run: |
          python3 tools/inspect-pe.py build-zig/AzySkin.exe
          python3 -m ziglang rc /i resources /fo /tmp/azy_skin.res resources/azy_skin.rc
          python3 tools/check-resources.py /tmp/azy_skin.res
      - uses: actions/upload-artifact@v4
        with:
          name: AzySkin-x64-cross
          path: build-zig/AzySkin.exe

  # The supported build: MSVC with the resource compiler (manifest, icon, version
  # information) plus the installer.
  windows-msvc:
    name: windows build (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DAZY_BUILD_TESTS=ON
      - name: Build
        shell: pwsh
        run: |
          $output = cmake --build build --config Release --parallel 2>&1 | Out-String
          $code = $LASTEXITCODE
          Set-Content -Path build.log -Value $output
          $output
          if ($code -ne 0) {
            # Same idea as the cross build: turn the compiler errors into annotations.
            ($output -split "`r?`n" |
              Where-Object { $_ -match 'error [A-Z]+[0-9]+|error RC[0-9]+|fatal error|LNK[0-9]+|FAILED:' } |
              Select-Object -First 10) | ForEach-Object { Write-Output "::error title=MSVC build::$($_.Trim())" }
            exit 1
          }
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: AzySkin-x64-msvc
          path: build/Release/AzySkin.exe

  installer:
    name: installer
    runs-on: windows-latest
    needs: windows-msvc
    steps:
      - uses: actions/checkout@v4
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Configure and build
        run: |
          cmake -S . -B build
          cmake --build build --config Release --parallel
      - name: Check the .iss input exists
        shell: pwsh
        run: |
          if (-not (Test-Path build/Release/AzySkin.exe)) {
            throw "build/Release/AzySkin.exe is missing; the .iss expects the MSVC Release output."
          }
      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /Qp packaging\AzySkin.iss 2>&1 | Tee-Object -Variable output | Out-Host
          if ($LASTEXITCODE -ne 0) {
            ($output | Where-Object { $_ -match 'Error|error|Unknown|expected' } |
              Select-Object -First 10) | ForEach-Object { Write-Output "::error title=ISCC::$($_.ToString().Trim())" }
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: AzySkin-installer
          path: dist/*.exe

      # The artifact store above is not reachable from every network. When the
      # triggering commit message asks for it ([deliver]), the compiled installer
      # is attached to the branch instead - git transport is the one channel that
      # works everywhere. The attached commit says [skip ci], so this cannot loop.
      - name: Attach the installer to the branch
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[deliver]')
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter 'AzySkin-*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw "dist/AzySkin-*-setup.exe was not produced" }
          Write-Host "Attaching $($setup.Name) ($([math]::Round($setup.Length / 1MB, 2)) MB) to ${{ github.ref_name }}"
          Get-FileHash $setup.FullName -Algorithm SHA256 | Format-List
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- $setup.FullName
          git commit -m "ci: attach $($setup.Name) [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
